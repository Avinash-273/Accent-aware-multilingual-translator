services:
  - type: web
    name: accent-aware-multilingual-translator
    runtime: node
    plan: free
    buildCommand: mkdir -p app && unzip -oq source.zip -d app && cd app && npm ci && npm run build
    startCommand: cd app && npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
